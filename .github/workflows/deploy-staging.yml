name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  AWS_REGION: us-east-1
  STAGE: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: https://api-staging.eureky.ai

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get infrastructure outputs
        id: infra
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "eureky-staging" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "eureky-staging" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' \
            --output text)

          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.infra.outputs.bucket_name }} --delete --exact-timestamps

      - name: Invalidate CloudFront
        run: |
          if [ "${{ steps.infra.outputs.distribution_id }}" != "PLACEHOLDER" ]; then
            echo "Invalidating CloudFront distribution..."
            aws cloudfront create-invalidation \
              --distribution-id ${{ steps.infra.outputs.distribution_id }} \
              --paths "/*"
          else
            echo "No CloudFront distribution to invalidate (using S3 direct)"
          fi

      - name: Deployment status
        run: |
          echo "✅ Staging deployment completed successfully!"
          WEBSITE_URL=$(aws cloudformation describe-stacks \
            --stack-name "eureky-staging" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`WebsiteURL`].OutputValue' \
            --output text)
          echo "🌐 Site URL: $WEBSITE_URL"